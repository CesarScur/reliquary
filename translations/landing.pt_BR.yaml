saints:
  title: 'Santos em Destaque'
  subtitle: 'Descubra as Vidas dos Santos'
  francis:
    name: 'São Francisco de Assis'
    dates: '1181 - 1226'
    bio: 'Fundador da Ordem Franciscana, conhecido por sua devoção à natureza, aos pobres e à paz. Recebeu os estigmas em 1224.'
  teresa:
    name: 'Santa Teresa de Ávila'
    dates: '1515 - 1582'
    bio: 'Mística espanhola, reformadora da Ordem Carmelita e Doutora da Igreja. Conhecida por seus escritos espirituais sobre oração contemplativa.'
  aquinas:
    name: 'São Tomás de Aquino'
    dates: '1225 - 1274'
    bio: 'Frade dominicano, filósofo e teólogo. Autor da Suma Teológica, uma das obras mais influentes da filosofia ocidental.'
  catherine:
    name: 'Santa Catarina de Siena'
    dates: '1347 - 1380'
    bio: 'Mística, ativista e Doutora da Igreja. Desempenhou papel significativo no retorno do papado de Avignon para Roma.'

