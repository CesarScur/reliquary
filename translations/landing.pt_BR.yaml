    title: 'Relíquias de Primeira Classe'
    description: 'Restos físicos de santos incluindo ossos, cabelos e sangue. Estas relíquias mais preciosas proporcionam a conexão física mais próxima à pessoa santa.'
  second:
    title: 'Relíquias de Segunda Classe'
    description: 'Itens possuídos ou frequentemente usados pelos santos durante sua vida, como roupas, livros, rosários ou instrumentos de seu martírio.'
